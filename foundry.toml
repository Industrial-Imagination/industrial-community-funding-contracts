[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_solc = true
optimizer = true
# Favor smaller deployed bytecode for the governed collection.
optimizer_runs = 100
via_ir = true
solc_version = "0.8.38"
evm_version = "prague"

[fmt]
line_length = 100
tab_width = 2
bracket_spacing = true
int_types = "long"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
